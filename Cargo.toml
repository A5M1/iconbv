[package]
name = "iconbv"
version = "0.1.0"
edition = "2024"
description = "A dark-glass Windows ICO builder for SVG and PNG artwork"
license = "MIT"

[features]
default = []
# Attach a console window (useful for debugging panics and logs).
console = []

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow"] }
ico = "0.6.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
resvg = "0.49.0"
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
